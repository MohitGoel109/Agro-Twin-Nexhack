name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Verify web app
        run: python web/verify_web.py

      - name: Verify operations
        run: python ops/verify_ops.py

      - name: Verify bulk ML
        run: python ml/verify_ml.py

      - name: Build deployment image
        run: docker build --tag agro-twin-web:ci .
